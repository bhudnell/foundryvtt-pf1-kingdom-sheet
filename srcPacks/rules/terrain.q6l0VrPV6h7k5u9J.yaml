    image: {}
    text:
      format: 1
      content: >-
        <p>Each hex on the map is 12 miles across from corner to corner,
        representing an area just under 95 square miles. The hexes are used to
        track the party’s movement while exploring, and as a means to help
        define the extent of different types of terrain. The exploration rates
        presented in these rules differ from the travel rates found in the Core
        Rulebook, since characters are also assumed to be taking time to fully
        explore each area they enter, which takes a great deal longer than
        simply walking through it.</p><p>To determine how long it takes the PCs
        to travel through a hex or fully explore it, determine the group’s base
        speed (set by the slowest member of the group) and consult Table 3–2:
        Travel Time (1 Hex) or Table 3–3: Exploration Time (1 Hex). These times
        represent the movement and exploration of a normal hex of the specified
        terrain type; rules presented later in this section modify the amount of
        time it takes to travel through or fully explore a hex.</p><p>A typical
        wilderness hex is trackless (see Table 7–8). Though no humanoid-created
        roads or trails pass through it, trails by game animals might. If a hex
        contains more than one terrain type, treat it as the most prevalent
        terrain for the purpose of travel times.</p><p></p><h2>Table 3-2: Travel
        Time (1 Hex)</h2><table><tbody><tr><td><p><strong>Party
        Speed</strong></p></td><td><p><strong>Plain</strong></p></td><td><p><strong>All
        Other Terrain</strong></p></td></tr><tr><td><p>15 feet</p></td><td><p>11
        hours</p></td><td><p>16 hours</p></td></tr><tr><td><p>20
        feet</p></td><td><p>8 hours</p></td><td><p>12
        hours</p></td></tr><tr><td><p>30 feet</p></td><td><p>5
        hours</p></td><td><p>8 hours</p></td></tr><tr><td><p>40
        feet</p></td><td><p>4 hours</p></td><td><p>6
        hours</p></td></tr><tr><td><p>50 feet</p></td><td><p>3
        hours</p></td><td><p>5
        hours</p></td></tr></tbody></table><p></p><h2>Table 3-3: Exploration
        Time</h2><table><tbody><tr><td><p><strong>Party
        Speed</strong></p></td><td><p><strong>Plain or
        Hill</strong></p></td><td><p><strong>Desert, Forest, or
        Marsh</strong></p></td><td><p><strong>Mountain</strong></p></td></tr><tr><td><p>15
        feet</p></td><td><p>3 days</p></td><td><p>4 days</p></td><td><p>5
        days</p></td></tr><tr><td><p>20 feet</p></td><td><p>2
        days</p></td><td><p>3 days</p></td><td><p>4
        days</p></td></tr><tr><td><p>30 feet</p></td><td><p>1
        day</p></td><td><p>2 days</p></td><td><p>3
        days</p></td></tr><tr><td><p>40 feet</p></td><td><p>1
        day</p></td><td><p>1 day</p></td><td><p>2
        days</p></td></tr><tr><td><p>50 feet</p></td><td><p>1
        day</p></td><td><p>1 day</p></td><td><p>1
        day</p></td></tr></tbody></table>
