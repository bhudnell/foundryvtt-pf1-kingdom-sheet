pages:
  - sort: 100000
    name: Terrain improvements
    type: text
    _id: w7TM2iUW4b734UF8
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>Terrain improvements are changes to a hex that improve the land for
        your kingdom’s use, such as cultivating fields, digging mines, and
        clearing forests for lumber. The following list describes common
        improvements. An improvement marked with an asterisk (*) can share the
        same hex as other improvements.</p><p>Some terrain improvements affect a
        settlement’s Defense, which is used in the mass combat rules.
        </p><p><strong>Terrain</strong>: This indicates what kind of hex you can
        build this terrain improvement in.</p><p><strong>Effect</strong>: This
        line states the effect the terrain improvement has on that hex (or in
        some cases, your entire kingdom).</p><p>If an improvement says you can
        upgrade it into another improvement, you can do so by paying the cost
        difference between the two improvements. When the upgrade is complete,
        you lose the benefit of the old improvement but gain the benefit of the
        new improvement.</p><p><strong>Cost</strong>: This line gives the cost
        in BP to build the terrain improvement.</p><p></p><h2>Table 4-6: Terrain
        and Terrain
        Improvements</h2><table><tbody><tr><td><p><strong>Terrain</strong></p></td><td><p><strong>Exploration
        Time</strong><sup><strong>1</strong></sup></p></td><td><p><strong>Preparation
        Time</strong><sup><strong>2</strong></sup></p></td><td><p><strong>Preparation
        Cost</strong><sup><strong>3</strong></sup></p></td><td><p><strong>Farm
        Cost</strong><sup><strong>4</strong></sup></p></td><td><p><strong>Road
        Cost</strong><sup><strong>5,
        6</strong></sup></p></td></tr><tr><td><p>Cavern<sup>7</sup></p></td><td><p>3
        days</p></td><td><p>3 months</p></td><td><p>8
        BP</p></td><td><p>—</p></td><td><p>4
        BP</p></td></tr><tr><td><p>Coastline<sup>8</sup></p></td><td><p>Special</p></td><td><p>Special</p></td><td><p>Special</p></td><td><p>Special</p></td><td><p>Special</p></td></tr><tr><td><p>Desert</p></td><td><p>2
        days</p></td><td><p>1 month</p></td><td><p>4 BP</p></td><td><p>8
        BP</p></td><td><p>4 BP</p></td></tr><tr><td><p>Forest</p></td><td><p>2
        days</p></td><td><p>2 months</p></td><td><p>4
        BP</p></td><td><p>—</p></td><td><p>2
        BP</p></td></tr><tr><td><p>Hills</p></td><td><p>1 day</p></td><td><p>1
        month</p></td><td><p>2 BP</p></td><td><p>4 BP</p></td><td><p>3
        BP</p></td></tr><tr><td><p>Jungle</p></td><td><p>2 days</p></td><td><p>4
        months</p></td><td><p>12 BP</p></td><td><p>—</p></td><td><p>4
        BP</p></td></tr><tr><td><p>Marsh</p></td><td><p>3 days</p></td><td><p>3
        months</p></td><td><p>8 BP</p></td><td><p>—</p></td><td><p>4
        BP</p></td></tr><tr><td><p>Mountains</p></td><td><p>3
        days</p></td><td><p>4 months</p></td><td><p>12
        BP</p></td><td><p>—</p></td><td><p>4
        BP</p></td></tr><tr><td><p>Plains</p></td><td><p>1
        day</p></td><td><p>Immediate</p></td><td><p>1 BP</p></td><td><p>2
        BP</p></td><td><p>1 BP</p></td></tr><tr><td><p>Water</p></td><td><p>2
        days</p></td><td><p>—</p></td><td><p>—</p></td><td><p>—</p></td><td><p>—</p></td></tr></tbody></table><p>1
        Exploration time represents how many days a typical scouting party
        requires to explore a hex of this type. These times assume a party speed
        of 30 feet. For parties with different speeds, see Table 3–3:
        Exploration Time (1 Hex) on the Movement Page. Treat Cavern as Mountain
        and Jungle as Marsh for exploration time. Do not adjust the speed for
        Water hexes; it’s assumed that the party is already using a boat or
        other watercraft to explore.</p><p>2 Preparation time represents the
        months of labor (beginning with the current turn) required to prepare
        the hex for settlement. Construction of buildings can begin in the
        current month for settlements built on plains.</p><p>3 Preparation cost
        represents the BP cost to clear a hex of this type in preparation for
        founding a settlement.</p><p>4 Farm cost represents the BP cost to
        cultivate a hex for farming. A Farm must be within or adjacent to a hex
        containing a river, lake, swamp, or Canal, or adjacent to at least 2
        hexes that already contain Farms.</p><p>5 Road cost represents the BP
        cost to establish a Road that crosses a hex and connects to all adjacent
        hexes. The cost to build a Road doubles if the hex contains rivers. A
        kingdom with a Size of 26 or greater can build a Highway (or upgrade a
        Road to a Highway).</p><p>6 If the hex contains any rivers, double the
        listed cost to reflect the need to build bridges.</p><p>7 This is a
        large system of caves and underground passages and can be found in any
        terrain type except Marsh. It functions as an additional hex that exists
        underground, below the surface hex.</p><p>8 Treat this as the adjacent
        land terrain type for all purposes.</p><h2>Aqueduct*</h2><p>An Aqueduct
        brings water from alpine lakes and rivers to lowland cities where water
        is scarce or insufficient for the local populace. A finished series of
        Aqueduct hexes must connect to a hill or mountain hex (with a river or
        lake) on one end and a settlement on the other end; otherwise, you do
        not gain its benefit.</p><p><strong>Terrain</strong>: One end must be
        hill or mountain hex; can pass through any type of hex.
        </p><p><strong>Effect</strong>: Loyalty +1, Stability +1, allows
        settlement to build water-dependent buildings.
        </p><p><strong>Cost</strong>: As a Road, except the cost is not doubled
        for hexes with rivers (see Table 4–6: Terrain and Terrain
        Improvements).</p><p></p><h2>Bridge*</h2><p>A Bridge allows your Road
        hexes to cross rivers.</p><p><strong>Cost</strong>: When you build a
        Road in a hex that contains a river, the doubled coast of the Road
        includes the cost of bridges needed to cross the river. You don’t need
        to build a Bridge as a separate unit; it’s listed here for reference
        only.</p><p></p><h2>Canal*</h2><p>A Canal is an artificial waterway that
        allows barge traffic to haul heavy
        commodities.</p><p><strong>Terrain</strong>: Desert, hill, or plain.
        </p><p><strong>Effect</strong>: Settlements in a hex with a Canal treat
        the hex as if it had a river.</p><p><strong>Cost</strong>: Twice the
        cost of a Road (see Table 4–6: Terrain and Terrain
        Improvements).</p><p></p><h2>Farm*</h2><p>A Farm helps feed your
        kingdom.</p><p><strong>Terrain</strong>: Desert (requires canal,
        coastline, or river), hill, or plain.</p><p><strong>Effect</strong>:
        Consumption decreases by 2 BP.</p><p><strong>Cost</strong>: See Table
        4–6: Terrain and Terrain Improvements.</p><p></p><h2>Fishery*</h2><p>A
        Fishery is like a Farm, except it provides abundant fish rather than
        planted crops.</p><p><strong>Terrain</strong>: Coastline, water, river,
        or marsh.</p><p><strong>Effect</strong>: Consumption decreases by 1 BP.
        </p><p><strong>Cost</strong>: 4 BP.</p><p></p><h2>Fort*</h2><p>A Fort is
        a walled encampment for military forces outside a settlement. You can
        upgrade a Watchtower to a Fort (Unrest decreases when you do so, just as
        if you had built the Fort from scratch).
        </p><p><strong>Terrain</strong>: Any land.
        </p><p><strong>Effect</strong>: Stability +2, Defense +4, increase
        Consumption by 1 BP; Unrest decreases by 1 when completed. If this hex
        becomes a settlement, this improvement counts as one Barracks and one
        Stables building.</p><p><strong>Cost</strong>: 24
        BP.</p><p></p><h2>Highway*</h2><p>A highway is a paved and
        well-maintained version of a Road. You may upgrade a Road into a
        Highway. You must have a kingdom of Size 26 or greater to build a
        Highway.</p><p><strong>Terrain</strong>: Any hex with a Road.
        </p><p><strong>Effect</strong>: Economy +1 for every 4 hexes of Highway,
        Stability +1 for every 8 hexes of Highway; improves overland travel
        speed.</p><p><strong>Cost</strong>: Twice the cost of a Road (see Table
        4–6: Terrain and Terrain Improvements).</p><p></p><h2>Mine</h2><p>A Mine
        extracts metal, coal, salt, or other useful materials from the earth.
        </p><p><strong>Terrain</strong>: Cavern, desert, hill, or mountain.
        </p><p><strong>Effect</strong>: Economy +1, earn +1 BP per turn when
        collecting taxes during the Income phase.</p><p><strong>Cost</strong>: 6
        BP.</p><p></p><h2>Quarry</h2><p>A Quarry extracts workable stone from
        the ground.</p><p><strong>Terrain</strong>: Cavern, hill, or mountain.
        </p><p><strong>Effect</strong>: Stability +1, earn +1 BP per turn when
        collecting taxes during the Income phase.</p><p><strong>Cost</strong>: 6
        BP.</p><p></p><h2>Road*</h2><p>A Road speeds travel through your kingdom
        and promotes trade. You can upgrade a Road to a Highway.
        </p><p><strong>Terrain</strong>: Any land.
        </p><p><strong>Effect</strong>: Economy +1 for every 4 hexes of Road,
        Stability +1 for every 8 hexes of Road; improves overland travel speed.
        </p><p><strong>Cost</strong>: See the Road column of Table 4–6: Terrain
        and Terrain Improvements.</p><p></p><h2>Sawmill</h2><p>A sawmill
        centralizes the activities of loggers and turns trees into lumber for
        use in building and crafting.</p><p><strong>Terrain</strong>: Forest or
        jungle.</p><p><strong>Effect</strong>: Stability +1, earn +1 BP per turn
        when collecting taxes during the Income phase.
        </p><p><strong>Cost</strong>: 3 BP.</p><p></p><h2>Watchtower*</h2><p>A
        Watchtower flies your flag, is a safe place for your patrols, and
        establishes your power on the frontier. A Watchtower cannot share a hex
        with a Fort or another Watchtower.</p><p><strong>Terrain</strong>: Any
        land.</p><p><strong>Effect</strong>: Stability +1, Defense +2; Unrest
        decreases by 1 when completed. If this hex becomes a settlement, this
        improvement counts as a Watchtower building.
        </p><p><strong>Cost</strong>: 12 BP.</p>
